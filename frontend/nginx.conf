server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # "backend" là tên service trong docker-compose.yml, Docker tự phân giải
    # thành đúng IP nội bộ của container backend trong cùng network.
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bắt tay WebSocket (STOMP, xem WebSocketConfig ở backend) cần nâng cấp giao thức —
    # thiếu 2 header Upgrade/Connection thì Nginx chỉ coi đây là request HTTP thường, kết nối fail.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback: mọi route client-side (React Router) đều trả về index.html
    location / {
        try_files $uri /index.html;
    }
}
