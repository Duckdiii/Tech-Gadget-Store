name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: techstore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MAVEN_OPTS: -Duser.timezone=UTC
      DB_URL: jdbc:postgresql://localhost:5432/techstore
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: TddZH+sG1lCRN/prDIgKGUWY9TFf8+giDh8HezidvkZn1/1QH3AsEj8E4hwSvo65
      EMAIL_SMTP_USER: ci@example.com
      EMAIL_SMTP_PASS: dummy
      EMAIL_FROM_ADDRESS: ci@example.com
      MOMO_ENDPOINT: https://dummy.example.com
      MOMO_PARTNER_CODE: dummy
      MOMO_ACCESS_KEY: dummy
      MOMO_SECRET_KEY: dummy
      MOMO_REDIRECT_URL: https://dummy.example.com
      MOMO_IPN_URL: https://dummy.example.com
      VNPAY_URL: https://dummy.example.com
      VNPAY_TMN_CODE: dummy
      VNPAY_HASH_SECRET: dummy
      VNPAY_RETURN_URL: https://dummy.example.com
      VNPAY_IPN_URL: https://dummy.example.com
      VNPAY_PAYMENT_URL: https://dummy.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: sh mvnw test -B

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to Production
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli
          railway up --service "Tech-Gadget-Store"

      - name: Deploy frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel
          vercel deploy --prod --yes --token=$VERCEL_TOKEN

      - name: Smoke test — chờ backend healthy sau deploy
        run: |
          for i in $(seq 1 10); do
            if curl -sf "https://tech-gadget-store-production.up.railway.app/actuator/health" | grep -q '"status":"UP"'; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Chờ backend healthy... ($i/10)"
            sleep 10
          done
          echo "Backend health check thất bại sau khi deploy"
          exit 1

  deploy-staging:
    name: Deploy to Staging
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy backend to Railway (staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          npm i -g @railway/cli
          railway up --service "Tech-Gadget-Store" --environment staging

      - name: Deploy frontend to Vercel (staging preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel
          DEPLOY_URL=$(vercel deploy --yes --token=$VERCEL_TOKEN)
          vercel alias set "$DEPLOY_URL" tech-gadget-store-staging.vercel.app --token=$VERCEL_TOKEN

      - name: Smoke test — chờ backend staging healthy sau deploy
        run: |
          for i in $(seq 1 10); do
            if curl -sf "https://tech-gadget-store-staging.up.railway.app/actuator/health" | grep -q '"status":"UP"'; then
              echo "Staging backend healthy"
              exit 0
            fi
            echo "Chờ backend staging healthy... ($i/10)"
            sleep 10
          done
          echo "Staging health check thất bại sau khi deploy"
          exit 1

  e2e-staging:
    name: E2E Test (Staging)
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against Staging
        working-directory: frontend
        env:
          E2E_BASE_URL: https://tech-gadget-store-staging.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
